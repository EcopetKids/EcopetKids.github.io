<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPet - Cargando Aventura...</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /* Estilos para que el contenedor del juego ocupe el 100% de la pantalla */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* El marco donde se verán tus múltiples páginas */
        #game-viewport {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Oculto mientras carga */
        }
    </style>
</head>
<body>

    <div id="loader-screen" class="loader-container">
        <h1 class="loader-title">EcoPet</h1>

        <div class="character-loading">
            <img src="imagenes/cachorrowin.png" alt="EcoPet Cargando" class="loading-avatar">
        </div>

        <p class="loader-text">Preparando el planeta para jugar...</p>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <iframe id="game-viewport" src="html/inicio.html"></iframe>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const progressFill = document.getElementById('progress-fill');
            const loaderScreen = document.getElementById('loader-screen');
            const gameViewport = document.getElementById('game-viewport');
            
            // --- MÚSICA DE FONDO EN ETERNO BUCLE ---
            const musicaFondo = new Audio('music/fondo.mp3');
            musicaFondo.loop = true; 
            musicaFondo.volume = 0.4; 

            // Intentar reproducir automáticamente
            musicaFondo.play().catch(error => {
                // Si el navegador bloquea el autoplay, se activa al primer clic en la carga
                document.addEventListener('click', () => {
                    musicaFondo.play();
                }, { once: true });
            });

            // Animación de la barra de progreso
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    
                    // Al terminar la carga, ocultamos el cargador y revelamos el marco del juego
                    loaderScreen.style.display = 'none';
                    gameViewport.style.display = 'block';
                } else {
                    width += 2; 
                    progressFill.style.width = width + '%';
                }
            }, 40); 
        });
    </script>
</body>
</html>
