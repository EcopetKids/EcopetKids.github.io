<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPet - Misión del Día</title>
    <link rel="stylesheet" href="../css/mision-intro.css">
</head>

<body>
    <div class="game-container">
        <h1 class="header-title">MISIÓN DEL DÍA</h1>

        <div class="game-content">

            <img src="../imagenes/cachorrowin.png" alt="EcoPet" class="ecopet-avatar" id="menu-avatar-pet">

            <div class="scroll-container">
                <div class="scroll-content">
                    <h3>🍃 Desafío:</h3>
                    <p class="challenge-text">Clasifica correctamente <br><strong>5 residuos de plástico</strong></p>

                    <hr class="divider">

                    <h3>🍃 Recompensa:</h3>
                    <p class="reward-text">⭐ +1 estrella | 🪙 +50 monedas</p>

                    <p class="encouragement">¡Tú puedes! Ayúdame a mantener limpio el planeta 💚</p>
                </div>
            </div>

        </div> <a href="mision-juego.html" class="btn-iniciar">INICIAR MISIÓN</a>
    </div>

    <script>
        // Diccionario con las rutas de las imágenes de tu perrito con sus trajes
        const rutasMenuImagenes = {
            'base': '../imagenes/cachorrowin.png',
            'collar': '../imagenes/cachorrocollar.png',
            'gorra': '../imagenes/cachorrogorrita.png',
            'lentes': '../imagenes/cachorrolentes.png',
            'mochila': '../imagenes/cachorromochila.png',
            'botas': '../imagenes/cachorrobotas.png',
            'panuleta': '../imagenes/cachorrobufanda.png'
        };

        function verificarRopaEquipada() {
            // Obtiene la prenda activa guardada en el vestidor (si no hay, usa la 'base')
            const equipado = localStorage.getItem('ecopet_equipado') || 'base';
            const avatarImg = document.getElementById('menu-avatar-pet');

            // Si el elemento existe y la ruta es válida, cambia la imagen
            if (avatarImg && rutasMenuImagenes[equipado]) {
                avatarImg.src = rutasMenuImagenes[equipado];
            }
        }

        // Ejecuta la comprobación automáticamente al cargar la pantalla
        window.onload = verificarRopaEquipada;
    </script>
</body>

</html>
