<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPet - Registro</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="game-container">
        <div class="avatar-header">
            <img src="../imagenes/cachorronombre.png" alt="EcoPet" class="ecopet-mini">
        </div>

        <div class="question-box">
            <h2>¿Cuál es tu <span class="highlight-orange">nombre</span>, aventurero?</h2>
        </div>

        <div class="input-box">
            <input type="text" id="username" placeholder="Escribe tu nombre aquí..." autocomplete="off">
        </div>

        <button id="btn-continuar" class="btn-continuar">CONTINUAR</button>
    </div>

    <script>
        // Guardar el nombre y pasar a la siguiente pantalla manteniéndose dentro del contenedor
        document.getElementById('btn-continuar').addEventListener('click', function () {
            const name = document.getElementById('username').value.trim();
            if (name !== "") {
                localStorage.setItem('ecoPetUsername', name); // Guardamos el nombre

                // Buscamos el contenedor padre (index.html) que sostiene el audio vivo
                const iframe = window.parent.document.getElementById('game-viewport');

                if (iframe) {
                    // MODIFICACIÓN CRITICA: Le cambiamos la URL al marco desde la perspectiva del index.html
                    // Como aprendizaje.html está en la carpeta 'html', la ruta es html/aprendizaje.html
                    iframe.src = 'html/aprendizaje.html';
                } else {
                    // Si pruebas la página por separado en tu PC sin pasar por el index, funciona normal
                    window.location.href = 'aprendizaje.html';
                }
            } else {
                alert("¡Por favor, dinos tu nombre para empezar la aventura!");
            }
        });
    </script>
</body>

</html>
