<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPet - Registro</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="game-container">
        <div class="avatar-header">
            <img src="../imagenes/cachorronombre.png" alt="EcoPet" class="ecopet-mini"
                style="width: 600px; height: auto;">
        </div>

        <div class="input-box">
            <input type="text" id="username" placeholder="Escribe tu nombre aquí..." autocomplete="off">
        </div>

        <button id="btn-continuar" class="btn-continuar">CONTINUAR</button>
    </div>

    <script>
        // Guardar el nombre y pasar a la siguiente pantalla
        document.getElementById('btn-continuar').addEventListener('click', function () {
            const name = document.getElementById('username').value.trim();
            if (name !== "") {
                localStorage.setItem('ecoPetUsername', name); // Guardamos el nombre
                window.location.href = 'aprendizaje.html';    // Va a la pantalla 3
            } else {
                alert("¡Por favor, dinos tu nombre para empezar la aventura!");
            }
        });
    </script>
</body>

</html>
