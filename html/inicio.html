<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPet - Inicio</title>
    <link rel="stylesheet" href="../css/inicio.css">
</head>

<body>
    <div class="game-container">
        <h1 class="logo-title">Ecopet Kids</h1>

        <div class="main-content">
            <div class="character-zone">
                <img src="../imagenes/cachorrofeli.png" alt="EcoPet" class="ecopet-avatar">
                <div class="bin-preview"></div>
            </div>

            <h2>Ecopet Kids – Mascota Virtual de Reciclaje Inteligente</h2>
            <p>¡Hola! Soy Ecopet, listo para ayudarte a cuidar el planeta.</p>
        </div>

        <button id="btn-jugar-inicio" class="btn-jugar">JUGAR</button>
    </div>

    <script>
        document.getElementById('btn-jugar-inicio').addEventListener('click', function() {
            // Buscamos el contenedor padre (index.html) que tiene la música viva
            const iframe = window.parent.document.getElementById('game-viewport');
            
            if (iframe) {
                // Cambiamos la página internamente. Como el login está en la misma carpeta 'html', 
                // para el index.html principal la ruta correcta es: html/login.html
                iframe.src = 'html/login.html'; 
            } else {
                // Si por alguna razón pruebas esta página suelta, funciona normal
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
